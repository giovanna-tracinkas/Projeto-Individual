<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title> Login | Bring Me The Horizon Brasil</title>
    <link rel="shortcut icon" href="assets/fav.webp" type="image/x-icon">
    <script src="validacaoCredenciais.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="flex tela-inteira login-cadastro">
        <div class="formulario sombra flex colunar">
            <h2>ENTRAR</h2>
            <div class="inputs flex colunar">
                <label for="ipt_email">E-MAIL:</label>
                <input type="text" id="ipt_email">
            </div>
            <div class="inputs flex colunar">
                <label for="ipt_senha">SENHA:</label>
                <input type="text" id="ipt_senha">
            </div>
            <div class="botoes flex colunar">
                <button onclick="logar()">ENTRAR</button>
                <hr>
                <h3>Ainda não possui conta?</h3>
                <button><a href="cadastro.html">CADASTRAR</a></button>
            </div>
        </div>
        <div class="img-formulario"></div>
    </div>
</body>

</html>
