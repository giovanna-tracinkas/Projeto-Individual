<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/fav.webp" type="image/x-icon">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Quiz | Bring Me The Horizon Brasil</title>
</head>

<body onload="iniciarQuiz()">
    <div class="hero flex">
        <header>
            <div id="secoes">
                <a href="dashboard/dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>
            </div>
            <div id="header-links">
                <a href="https://x.com/bmthofficial"> <i class="bi bi-twitter-x"></i></a>
                <a href="https://www.youtube.com/BMTHchannel/videos"><i class="bi bi-play-btn-fill"></i></a>
                <a href="https://open.spotify.com/intl-pt/artist/1Ffb6ejR6Fe5IamqA5oRUF"><i
                        class="bi bi-spotify"></i></a>
                <a href="https://www.instagram.com/bringmethehorizon/"><i class="bi bi-instagram"></i></a>
            </div>
        </header>
        <div class="hero-content">
            <h1>DESCUBRA QUAL ÁLBUM COMBINA COM VOCÊ</h1>
            <p>Responda o quiz baixo e descubra qual álbum do Bring Me The Horizon mais combina com a sua personalidade.
            </p>
        </div>
    </div>
    <div class="tela-inteira flex container-jogo">
        <div class="flex colunar jogo">
            <div id="infoTitulo">
                <span id="perguntas_restantes">Perguntas restantes:</span>
            </div>

            <div id="infoQuestao">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                    questões.</span>
            </div>
            <div id="perguntaDaQuestaoAtual">
                <b><span id="spanQuestaoExibida"></span></b>
            </div>
            <div id="infoAlternativas">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>
            <div id="div_alternativas" class="alternativas">
            </div>
            <div class="flex colunar btn-quiz">
                <button onclick="submeter()" id="btnSubmeter" class="btn-avancar">Submeter</button>
                <button onclick="avancar()" id="btnProx" class="btn-avancar" disabled>Avançar</button>
            </div>

        </div>
    </div>
    <footer class="flex">
        2026 BRING ME THE HORIZON BRASIL
    </footer>
</body>

</html>
<script>
    // Declaração de pontuação de albuns
    let pontuacaoAlbuns = {
        sempiternal: 0,
        amo: 0,
        survivalHorror: 0,
        thereIsAHell: 0,
        thatsTheSpirit: 0,
        nexGen: 0
    }

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let opcaoSelecionada = null

    //Perfil emocional
    let melancolico = 0;
    let animado = 0;
    let ansioso = 0;

    const listaDeQuestoes = [
        {
            pergunta: "Qual estética te agrada mais visualmente?",
            alternativas: [
                {
                    texto: "Cyberpunk",
                    album1: "survivalHorror",
                    perfil: "ansioso"
                },
                {
                    texto: "Surrealismo",
                    album1: "thereIsAHell",
                    perfil: "melancolico"
                },
                {
                    texto: "Minimalismo",
                    album1: "sempiternal",
                    album2: "thatsTheSpirit",
                    album3: "amo",
                    perfil: "melancolico"
                },
                {
                    texto: "Anime/Virtual",
                    album1: "nexGen",
                    perfil: "animado"
                },
            ]
        },
        {
            pergunta: "Qual assunto mais prende sua atenção?",
            alternativas: [
                {
                    texto: "Tecnologia",
                    album1: "nexGen",
                    perfil: "animado"
                },
                {
                    texto: "Espiritualismo",
                    album1: "thereIsAHell",
                    perfil: "melancolico"
                },
                {
                    texto: "Apocalipse",
                    album1: "survivalHorror",
                    perfil: "ansioso"
                },
                {
                    texto: "Vida cotidiana",
                    album1: "sempiternal",
                    album2: "thatsTheSpirit",
                    album3: "amo",
                    perfil: "melancolico"
                }
            ]
        },
        {
            pergunta: "Como as pessoas te descrevem?",
            alternativas: [
                {
                    texto: "Sensível",
                    album1: "amo",
                    perfil: "melancolico"
                },
                {
                    texto: "Ansioso",
                    album1: "survivalHorror",
                    perfil: "ansioso"
                },
                {
                    texto: "Melancólico",
                    album1: "sempiternal",
                    album2: "thereIsAHell",
                    album3: "thatsTheSpirit",
                    perfil: "melancolico"
                },
                {
                    texto: "Enérgico",
                    album1: "nexGen",
                    perfil: "animado"
                },
            ]
        },
        {
            pergunta: "Como você age quando não está bem emocionalmente?",
            alternativas: [
                {
                    texto: "Me isolo",
                    album1: "amo",
                    album2: "sempiternal",
                    album3: "thereIsAHell",
                    perfil: "melancolico"
                },
                {
                    texto: "Jogo ou escuto música",
                    album1: "nexGen",
                    perfil: "ansioso"
                },
                {
                    texto: "Tento transformar em motivação",
                    album1: "thatsTheSpirit",
                    album2: "survivalHorror",
                    perfil: "animado"
                },
            ]
        }
    ]

    let quantidadeDeQuestoes = listaDeQuestoes.length

    function iniciarQuiz() {
        document.getElementById('infoTitulo').style.display = "flex"
        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes
        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        const questaoAtual = listaDeQuestoes[index];
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        div_alternativas.innerHTML = "";

        for (let i = 0; i < questaoAtual.alternativas.length; i++) {
            div_alternativas.innerHTML += ` <button id="botao${i}" onclick="selecionar(${i})" class="alternativa" style="
        background-image: url('${questaoAtual.alternativas[i].imagem}');
    ">
    
            ${questaoAtual.alternativas[i].texto} </button>
    `;
        }
    }

    function selecionar(opcao) {
        opcaoSelecionada = opcao;
    }

    function submeter() {
        if (opcaoSelecionada == null) {
            alert("Não há alternativas escolhidas. Escolha uma opção.");
            return;
        } else {
            let alternativaEscolhida = listaDeQuestoes[numeroDaQuestaoAtual].alternativas[opcaoSelecionada];
            pontuacaoAlbuns[alternativaEscolhida.album1]++;

            if (alternativaEscolhida.album2 != undefined) {
                pontuacaoAlbuns[alternativaEscolhida.album2]++;
            }

            if (alternativaEscolhida.album3 != undefined) {
                pontuacaoAlbuns[alternativaEscolhida.album3]++;
            }

            if (alternativaEscolhida.perfil == "melancolico") {
                melancolico++;
            } else if (alternativaEscolhida.perfil == "animado") {
                animado++;
            } else if (alternativaEscolhida.perfil == "ansioso") {
                ansioso++;
            }
            for (let i = 0; i < listaDeQuestoes[numeroDaQuestaoAtual].alternativas.length; i++) {
                document.getElementById("botao" + i).disabled = true;
            }
        }

        btnSubmeter.disabled = true;
        btnProx.disabled = false;
    }

    function avancar() {
        opcaoSelecionada = null;
        btnProx.disabled = true
        btnSubmeter.disabled = false


        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            numeroDaQuestaoAtual++;
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
    }

    function finalizarJogo() {
        let listaAlbuns = [
            pontuacaoAlbuns.survivalHorror,
            pontuacaoAlbuns.nexGen,
            pontuacaoAlbuns.thereIsAHell,
            pontuacaoAlbuns.amo,
            pontuacaoAlbuns.thatsTheSpirit,
            pontuacaoAlbuns.sempiternal
        ]

        let nomesAlbuns = [
            "Survival Horror",
            "neX GEn",
            "There Is A Hell",
            "Amo",
            "Thats The Spirit",
            "Sempiternal",
        ];

        let albumMaisVotado = nomesAlbuns[0];
        let albumMaiorPontuacao = listaAlbuns[0];
        let perfilResultado = "melancolico";

        for (let i = 0; i < listaAlbuns.length; i++) {
            if (listaAlbuns[i] > albumMaiorPontuacao) {
                albumMaiorPontuacao = listaAlbuns[i];
                albumMaisVotado = nomesAlbuns[i];
            }
        }

        if (ansioso > melancolico && ansioso > animado) {
            perfilResultado = "ansioso";
        } else if (animado > melancolico && animado > ansioso) {
            perfilResultado = "animado";
        } else {
            perfilResultado = "melancolico";
        }
        let fkUsuario = sessionStorage.ID_USUARIO;


        btnProx.disabled = true
        btnSubmeter.disabled = true

        fetch("/dashboard/enviarQuiz", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fkUsuarioServer: fkUsuario,
                nomeAlbumServer: albumMaisVotado,
                perfilServer: perfilResultado,

                sempiternalServer: pontuacaoAlbuns.sempiternal,
                amoServer: pontuacaoAlbuns.amo,
                survivalHorrorServer: pontuacaoAlbuns.survivalHorror,
                thereIsAHellServer: pontuacaoAlbuns.thereIsAHell,
                thatsTheSpiritServer: pontuacaoAlbuns.thatsTheSpirit,
                nexGenServer: pontuacaoAlbuns.nexGen
            })
        }).then(resposta => {
            console.log('Quiz salvo');
            window.location = "../dashboard/dashboard.html";
        }).catch(erro => {
            console.log("Erro ao salvar quiz:", erro);
        });
    }

</script>
