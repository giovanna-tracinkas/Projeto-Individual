<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title> Dashboard | Bring Me The Horizon Brasil</title>
    <link rel="shortcut icon" href="../assets/fav.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="buscarResultado(), carregarGraficoRosca(), carregarGraficoRadar()">
    <div class="flex colunar tela-inteira">
        <header>
            <div class="secoes">
                <a href="../quiz.html">QUIZ</a>
                <a href="../index.html">SAIR</a>
            </div>
            <div id="header-links">
                <a href="https://x.com/bmthofficial"> <i class="bi bi-twitter-x"></i></a>
                <a href="https://www.youtube.com/BMTHchannel/videos"><i class="bi bi-play-btn-fill"></i></a>
                <a href="https://open.spotify.com/intl-pt/artist/1Ffb6ejR6Fe5IamqA5oRUF"><i
                        class="bi bi-spotify"></i></a>
                <a href="https://www.instagram.com/bringmethehorizon/"><i class="bi bi-instagram"></i></a>
            </div>
        </header>
        <div class="dashboard">
            <h1>Seus resultados</h1>
            <div class="kpis">
                <div class="kpi gradient-to-right sombra">
                    <p class="titulo">Seu álbum dominante:</p>
                    <p class="dado" id="albumResultado"></p>
                </div>
                <div class="kpi gradient-to-left sombra">
                    <p class="titulo">Sua música recomendada:</p>
                    <p class="dado" id="musicaResultado"></p>
                </div>
                <div class="kpi fundo-roxo sombra">
                    <p class="titulo">Seu perfil emocional:</p>
                    <p class="dado" id="perfilEmocionalResultado"></p>
                </div>
            </div>
            <div class="graficos flex">
                <div class="grafico fundo-padrao sombra">
                    <canvas id="distribuicaoAlbuns"></canvas>
                </div>
                <div class="grafico fundo-padrao sombra">
                    <canvas id="perfilEmocional"></canvas>
                </div>
            </div>
        </div>
        <footer class="flex">
            2026 BRING ME THE HORIZON BRASIL
        </footer>
    </div>
</body>
<script>
    let fkUsuario = sessionStorage.ID_USUARIO;
    const graficoRosca = document.getElementById('distribuicaoAlbuns');
    const graficoRadar = document.getElementById('perfilEmocional');

    function buscarResultado() {
        fetch(`/dashboard/buscarAlbum/${fkUsuario}`, {
            method: "GET"
        })
            .then(res => {
                res.json().then(json => {
                    albumResultado.innerHTML = json[0].album;
                    musicaResultado.innerHTML = json[0].musica;
                    perfilEmocionalResultado.innerHTML = json[0].perfil;
                })
            })
            .catch(err => {
                console.log(err);
            })
    }

    function carregarGraficoRosca() {
        fetch(`/dashboard/compatibilidadeAlbum/${fkUsuario}`, {
            method: "GET"
        })
            .then(res => {
                res.json().then(json => {
                    console.log(json);

                    let dados = json[0];

                    new Chart(graficoRosca, {
                        type: 'doughnut',
                        data: {
                            labels: ['Sempiternal', 'Amo', 'Survival Horror', 'There Is A Hell', 'Thats The Spirit', 'Nex GEn'],
                            datasets: [{
                                data: [dados.sempiternal,
                                dados.amo,
                                dados.survivalHorror,
                                dados.thereIsAHell,
                                dados.thatsTheSpirit,
                                dados.nexGen
                                ]
                            }]
                        },
                    });
                })
            })
            .catch(err => {
                console.log(err);
            })
    }


      function carregarGraficoRadar() {
        fetch(`/dashboard/perfilEmocional/${fkUsuario}`, {
            method: "GET"
        })
            .then(res => {
                res.json().then(json => {
                    console.log(json);

                    let dados = json[0];

                    new Chart(graficoRadar, {
                        type: 'radar',
                        data: {
                            labels: ['Melancólico', 'Animado', 'Ansioso'],
                            datasets: [{
                                label: 'Perfil Emocional',
                                data: [dados.melancolico,
                                dados.animado,
                                dados.ansioso
                                ],
                            backgroundColor: 'rgba(168, 85, 247, 0.2)'
                            }]
                        },
                    });
                })
            })
            .catch(err => {
                console.log(err);
            })
    }
</script>

</html>
