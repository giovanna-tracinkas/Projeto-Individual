<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title> Dashboard | Bring Me The Horizon Brasil</title>
    <link rel="shortcut icon" href="../assets/fav.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="tela-inteira">
    <header>
        <div>
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="index.html">Sair</a>
        </div>
        <div id="header-links">
            <a href="https://x.com/bmthofficial"> <i class="bi bi-twitter-x"></i></a>
            <a href="https://www.youtube.com/BMTHchannel/videos"><i class="bi bi-play-btn-fill"></i></a>
            <a href="https://open.spotify.com/intl-pt/artist/1Ffb6ejR6Fe5IamqA5oRUF"><i class="bi bi-spotify"></i></a>
            <a href="https://www.instagram.com/bringmethehorizon/"><i class="bi bi-instagram"></i></a>
        </div>
    </header>
    <div class="flex colunar cards">
        <div class="kpis">
            <div class="kpi">
                <p class="titulo">Seu álbum dominante:</p>
                <p class="dado">Sempiternal</p>
            </div>
            <div class="kpi">
                <p class="titulo">Sua música recomendada:</p>
                <p class="dado">Shadow Moses</p>
            </div>
            <div class="kpi">
                <p class="titulo">Seu perfil emocional:</p>
                <p class="dado">Melancólico</p>
            </div>
        </div>
        <div class="graficos">
            <div class="grafico">
                <canvas id="distribuicaoAlbuns"></canvas>
            </div>
            <div class="grafico">
                <canvas id="perfilEmocional"></canvas>
            </div>
        </div>

    </div>
</body>
<script>
    const graficoBarras = document.getElementById('distribuicaoAlbuns');
    const graficoRadar = document.getElementById('perfilEmocional');

    new Chart(graficoBarras, {
        type: 'doughnut',
        data: {
            labels: ['Sempiternal', 'Amo', 'Thats The Spirit', 'Count Your Blessings', 'There Is A Hell'],
            datasets: [{
                label: 'Compatibilidade por álbum',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    const config = {
        type: 'radar',
        data: {
            labels: ['Running', 'Swimming', 'Eating', 'Cycling'],
            datasets: [{
            data: [20, 10, 4, 2]
        }]
    },
        options: {
            elements: {
                line: {
                    borderWidth: 3
                }
            }
        },
    };
    new Chart(graficoRadar, config);

</script>

</html>
