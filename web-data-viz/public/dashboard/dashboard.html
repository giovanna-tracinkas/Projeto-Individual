<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title> Dashboard | Bring Me The Horizon Brasil</title>
    <link rel="shortcut icon" href="../assets/fav.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="tela-inteira" onload="buscarResultado()">
    <header>
        <div id="header-links">
            <a href="https://x.com/bmthofficial"> <i class="bi bi-twitter-x"></i></a>
            <a href="https://www.youtube.com/BMTHchannel/videos"><i class="bi bi-play-btn-fill"></i></a>
            <a href="https://open.spotify.com/intl-pt/artist/1Ffb6ejR6Fe5IamqA5oRUF"><i class="bi bi-spotify"></i></a>
            <a href="https://www.instagram.com/bringmethehorizon/"><i class="bi bi-instagram"></i></a>
        </div>
        <div>
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="index.html">Sair</a>
        </div>
    </header>
    <div class="flex dashboard">
        <div id="esquerdo" class="flex colunar">
            <h1>Seus resultados</h1>
            <div class="kpis">
                <div class="kpi gradient-to-right sombra">
                    <p class="titulo">Seu álbum dominante:</p>
                    <p class="dado" id="albumResultado"></p>
                </div>
                <div class="kpi gradient-to-left sombra">
                    <p class="titulo">Sua música recomendada:</p>
                    <p class="dado">Shadow Moses</p>
                </div>
                <div class="kpi fundo-roxo sombra">
                    <p class="titulo">Seu perfil emocional:</p>
                    <p class="dado">Melancólico</p>
                </div>
            </div>
            <div class="graficos flex">
                <div class="grafico fundo-padrao sombra">
                    <canvas id="distribuicaoAlbuns"></canvas>
                </div>
                <div class="grafico fundo-padrao sombra">
                    <canvas id="perfilEmocional"></canvas>
                </div>
            </div>
        </div>
        <div id="resultado">
            <div id="imagem-resultado"></div>
            <div id="resultado-album"></div>
            <div id="frase"></div>
        </div>
    </div>
</body>
<script>

    const graficoBarras = document.getElementById('distribuicaoAlbuns');
    const graficoRadar = document.getElementById('perfilEmocional');

    new Chart(graficoBarras, {
        type: 'doughnut',
        data: {
            labels: ['Sempiternal', 'Amo', 'Thats The Spirit', 'Count Your Blessings', 'There Is A Hell'],
            datasets: [{
                label: 'Compatibilidade por álbum',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    const config = {
        type: 'radar',
        data: {
            labels: ['Running', 'Swimming', 'Eating', 'Cycling'],
            datasets: [{
                data: [20, 10, 4, 2],
                backgroundColor: '#a855f7'
            }]
        },
        options: {
            elements: {
                line: {
                    borderWidth: 3
                }
            }
        },
    };
    new Chart(graficoRadar, config);

    function buscarResultado() {
        let fkUsuario = sessionStorage.ID_USUARIO; 

        fetch(`/dashboard/buscarResultado/${fkUsuario}`, {
            method: "GET"
        })
            .then(res => {
                res.json().then(json => {
                    
                    albumResultado.innerHTML = json[0].titulo
                })
            })
            .catch(err => {
                console.log(err);
            })
    }

</script>

</html>
